services:
  db:
    image: mysql:8.4
    container_name: wanteat-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env に MYSQL_ROOT_PASSWORD を設定してください}
      MYSQL_DATABASE: wanteat
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env に MYSQL_PASSWORD を設定してください}
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # ホストのループバックのみに公開する（LAN からは見えない）
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    image: eclipse-temurin:21-jdk
    container_name: wanteat-backend
    working_dir: /workspace
    command: ["./gradlew", "bootRun", "--no-daemon"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: wanteat
      DB_USER: appuser
      DB_PASSWORD: ${MYSQL_PASSWORD:?.env に MYSQL_PASSWORD を設定してください}
      JWT_SECRET: ${JWT_SECRET:?.env に JWT_SECRET を設定してください（openssl rand -base64 48）}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      GRADLE_USER_HOME: /workspace/.gradle-home
      TZ: Asia/Tokyo
    volumes:
      - ./backend:/workspace
      - gradle-cache:/workspace/.gradle-home
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22
    container_name: wanteat-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      API_BASE_URL: http://backend:8080
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      TZ: Asia/Tokyo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
  gradle-cache:
