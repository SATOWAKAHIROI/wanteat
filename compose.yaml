services:
  db:
    image: mysql:8.4
    container_name: wanteat-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wanteat
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    image: eclipse-temurin:21-jdk
    container_name: wanteat-backend
    working_dir: /workspace
    command: ["./gradlew", "bootRun", "--no-daemon"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: wanteat
      DB_USER: appuser
      DB_PASSWORD: apppass
      JWT_SECRET: dev-secret-key-please-change-in-production-env
      GRADLE_USER_HOME: /workspace/.gradle-home
      TZ: Asia/Tokyo
    volumes:
      - ./backend:/workspace
      - gradle-cache:/workspace/.gradle-home
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22
    container_name: wanteat-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      API_BASE_URL: http://backend:8080
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      TZ: Asia/Tokyo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
  gradle-cache:
