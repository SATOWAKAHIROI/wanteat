# 本番用。開発用の compose.yaml とは別プロジェクトとして動くので、
# ボリュームもコンテナも混ざらない。
#
#   docker compose -f compose.prod.yaml up -d --build
#
name: wanteat-prod

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env に MYSQL_ROOT_PASSWORD を設定してください}
      MYSQL_DATABASE: ${DB_NAME:-wanteat}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env に MYSQL_PASSWORD を設定してください}
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # ports は公開しない。外部から DB に直接触れないようにする
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-wanteat}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:?.env に MYSQL_PASSWORD を設定してください}
      JWT_SECRET: ${JWT_SECRET:?.env に JWT_SECRET を設定してください（openssl rand -base64 48）}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?.env に ANTHROPIC_API_KEY を設定してください}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      # HTTPS 配信なので secure=true。false のままだと Cookie が送られずログインできない
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      # 同一オリジン構成なので COOKIE_DOMAIN と CORS_ORIGINS は不要
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # 空文字にすると /api/... の相対パスで呼ぶ。Caddy が同一オリジンで振り分ける
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: "${DOMAIN:?.env に DOMAIN を設定してください。本番はホスト名、ローカル検証は :80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
