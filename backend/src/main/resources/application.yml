spring:
  application:
    name: wanteat

  datasource:
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:wanteat}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
    username: ${DB_USER:appuser}
    password: ${DB_PASSWORD:apppass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  docker:
    compose:
      enabled: false

server:
  port: 8080

ai:
  model: ${AI_MODEL:claude-opus-5}
  api-key: ${ANTHROPIC_API_KEY:}

jwt:
  secret: ${JWT_SECRET:change-me-to-256-bit-secret-in-production-environment}
  expiration-ms: 2592000000

logging:
  level:
    com.example.wanteat: debug
