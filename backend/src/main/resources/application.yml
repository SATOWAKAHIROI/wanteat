spring:
  application:
    name: wanteat

  datasource:
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:wanteat}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
    username: ${DB_USER:appuser}
    password: ${DB_PASSWORD:apppass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  docker:
    compose:
      enabled: false

server:
  port: 8080

app:
  cookie:
    # 本番（HTTPS）では secure=true が必須。false のままだと Cookie が送信されずログインできない
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    # フロントと API でサブドメインが分かれる場合のみ指定する（例: .example.com）
    domain: ${COOKIE_DOMAIN:}
  cors:
    # カンマ区切りで複数指定できる
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  signup:
    # 空なら誰でも登録できる。値を設定すると招待コードが必須になる
    invite-code: ${SIGNUP_INVITE_CODE:}

ai:
  model: ${AI_MODEL:claude-opus-5}
  api-key: ${ANTHROPIC_API_KEY:}

jwt:
  secret: ${JWT_SECRET}   # 既定値なし。未設定だと起動に失敗する（本番で dev 値が使われる事故を防ぐ）
  expiration-ms: 2592000000

logging:
  level:
    com.example.wanteat: debug
